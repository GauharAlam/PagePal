<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PagePal AI</title>
  <link rel="stylesheet" href="sidebar.css" />
</head>

<body>
  <div id="app">

    <!-- ======================================================
         HEADER
         ====================================================== -->
    <header class="sidebar-header">
      <div class="logo-area">
        <span class="logo-emoji" aria-hidden="true">🧠</span>
        <span class="logo-text">PagePal AI</span>
      </div>

      <div class="header-actions">
        <!-- Theme Toggle -->
        <button class="icon-btn theme-toggle" id="themeToggle" title="Toggle light / dark mode"
          aria-label="Toggle theme">
          <!-- Icon swaps via JS -->
          <span id="themeIcon">☀️</span>
        </button>

        <!-- Refresh context -->
        <button class="icon-btn" id="refreshBtn" title="Refresh page context" aria-label="Refresh page context">
          🔄
        </button>
      </div>
    </header>

    <!-- ======================================================
         CONTEXT BAR
         ====================================================== -->
    <div class="context-bar" id="contextBar" aria-live="polite">
      <span class="context-badge" id="contextBadge">
        🔍 Loading context…
      </span>
    </div>

    <!-- ======================================================
         CHAT AREA
         ====================================================== -->
    <main class="chat-area" id="chatContainer" role="log" aria-live="polite">

      <!-- Welcome Message (shown until first message) -->
      <div class="welcome-message" id="welcomeMessage">
        <h2>Hello, GAUHAR ALAM</h2>
        <p>What can I help with?</p>
      </div>

    </main>



    <!-- ======================================================
         FLOATING INPUT CARD
         ====================================================== -->
    <div class="floating-input-card">
      <div class="drag-handle-indicator"></div>

      <div class="slim-quick-actions">
        <span class="slim-action" data-action="summarize">Summarize</span>
        <span class="slim-action" data-action="keypoints">Key Points</span>
        <span class="slim-action" data-action="selection">Selection</span>
      </div>

      <div class="input-wrapper">
        <textarea id="userInput" rows="1" placeholder="Ask anything..." aria-label="Your message" autocomplete="off"
          spellcheck="true"></textarea>

        <button id="sendBtn" title="Send message (Enter)" aria-label="Send message" style="display: none;">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>

      <div class="input-actions-bar">
        <div class="action-group-left">
          <button class="action-icon-btn" id="uploadFileBtn" title="Upload file or image">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <path
                d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48">
              </path>
            </svg>
          </button>
          <button class="action-icon-btn" id="screenshotBtn" title="Take a screenshot">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2" stroke-dasharray="4 4"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
          </button>

          <div class="model-select-wrapper">
            <button class="action-icon-btn" id="modelSelectBtn" title="Select Model: Auto">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect>
                <rect x="9" y="9" width="6" height="6"></rect>
                <line x1="9" y1="1" x2="9" y2="4"></line>
                <line x1="15" y1="1" x2="15" y2="4"></line>
                <line x1="9" y1="20" x2="9" y2="23"></line>
                <line x1="15" y1="20" x2="15" y2="23"></line>
                <line x1="20" y1="9" x2="23" y2="9"></line>
                <line x1="20" y1="14" x2="23" y2="14"></line>
                <line x1="1" y1="9" x2="4" y2="9"></line>
                <line x1="1" y1="14" x2="4" y2="14"></line>
              </svg>
            </button>
            <div class="model-dropdown" id="modelDropdown">
              <button class="model-option active" data-model="auto">
                <span class="model-icon">✨</span>
                <div class="model-info">
                  <div class="model-name">Auto (Default)</div>
                  <div class="model-desc">Smartly routes to the best model</div>
                </div>
              </button>
              <button class="model-option" data-model="nvidia">
                <span class="model-icon">🟢</span>
                <div class="model-info">
                  <div class="model-name">NVIDIA Llama 3.1</div>
                  <div class="model-desc">Fast, capable, standard model</div>
                </div>
              </button>
              <button class="model-option" data-model="deepseek">
                <span class="model-icon">🔍</span>
                <div class="model-info">
                  <div class="model-name">DeepSeek</div>
                  <div class="model-desc">Best for code and logic</div>
                </div>
              </button>
              <button class="model-option" data-model="grok">
                <span class="model-icon">𝕏</span>
                <div class="model-info">
                  <div class="model-name">Grok 2</div>
                  <div class="model-desc">Best for news and trending</div>
                </div>
              </button>
            </div>
          </div>
        </div>

        <div class="action-group-right">
          <button class="action-icon-btn voice-btn" id="voiceBtn" title="Voice Input">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <line x1="12" y1="6" x2="12" y2="18"></line>
              <line x1="8" y1="10" x2="8" y2="14"></line>
              <line x1="16" y1="10" x2="16" y2="14"></line>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- ======================================================
         FOOTER
         ====================================================== -->
    <footer class="footer-bar" aria-label="Extension info">
      Powered by AI &bull; PagePal v1.0
    </footer>

  </div><!-- /#app -->

  <script src="sidebar.js"></script>
</body>

</html>
